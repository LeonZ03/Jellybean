<style>
  #jellybean-fur-slider {
    display: grid;
    gap: 0.35em;
    max-width: 560px;
    margin-inline: auto;
    color: var(--foreground, CanvasText);
  }
  #jellybean-fur-slider canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    /* Keep the screenshot's gray backdrop fixed for color comparison. */
    background: linear-gradient(#adadaf 89.2%, #979799 89.2% 89.6%, #adadaf 89.6%);
  }
  #jellybean-fur-slider .fur-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75em;
  }
  #jellybean-fur-slider output {
    display: inline-block;
    min-width: 3ch;
    margin-inline-start: 0.35em;
    text-align: end;
  }
</style>

<script>
  (() => {
    const root = document.getElementById("jellybean-fur-slider");
    const canvas = root.querySelector("canvas");
    const context = canvas.getContext("2d");
    const slider = root.querySelector("input");
    const value = root.querySelector("output");
    const play = root.querySelector("button");
    const frameWidth = 300;
    const frameHeight = 220;
    const frameCount = 12;
    const frameTime = 100;
    const x = (canvas.width - frameWidth) / 2;
    const blended = context.createImageData(frameWidth, frameHeight);
    let endpoints;
    let amount = 50;
    let pose = 0;
    let lastTime = 0;
    let elapsed = 0;
    let animationFrame;
    let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;

    async function loadFrames(endpoint) {
      const encoded = root.querySelector(`template[data-endpoint="${endpoint}"]`).content.textContent;
      const image = new Image();
      image.src = "data:image/webp;base64," + encoded.replace(/\s+/g, "");
      await image.decode();

      const atlas = document.createElement("canvas");
      atlas.width = image.width;
      atlas.height = image.height;
      const source = atlas.getContext("2d", { willReadFrequently: true });
      source.drawImage(image, 0, 0);
      return Array.from({ length: frameCount }, (_, i) =>
        source.getImageData((i % 4) * frameWidth, Math.floor(i / 4) * frameHeight, frameWidth, frameHeight));
    }

    function drawPose() {
      if (!endpoints) return;
      const [left, right] = endpoints.map(frames => frames[pose]);
      if (amount === 0 || amount === 100) {
        context.putImageData(amount === 0 ? left : right, x, 0);
        return;
      }

      const t = amount / 100;
      const a = left.data;
      const b = right.data;
      const result = blended.data;
      for (let i = 0; i < result.length; i += 4) {
        result[i] = Math.round(a[i] + (b[i] - a[i]) * t);
        result[i + 1] = Math.round(a[i + 1] + (b[i + 1] - a[i + 1]) * t);
        result[i + 2] = Math.round(a[i + 2] + (b[i + 2] - a[i + 2]) * t);
        result[i + 3] = a[i + 3];
      }
      context.putImageData(blended, x, 0);
    }

    function setAmount(next) {
      if (!Number.isInteger(next) || next < 0 || next > 100) return;
      amount = next;
      slider.value = String(amount);
      value.value = String(amount);
      drawPose();
    }

    function animate(now) {
      if (!playing) return;
      if (lastTime) elapsed += now - lastTime;
      lastTime = now;
      const nextPose = Math.floor(elapsed / frameTime) % frameCount;
      if (nextPose !== pose) {
        pose = nextPose;
        drawPose();
      }
      animationFrame = requestAnimationFrame(animate);
    }

    function setPlaying(next) {
      playing = next;
      play.textContent = playing ? "暂停" : "播放";
      lastTime = 0;
      cancelAnimationFrame(animationFrame);
      if (playing) animationFrame = requestAnimationFrame(animate);
    }

    slider.addEventListener("input", () => setAmount(slider.valueAsNumber));
    slider.addEventListener("change", () => {
      window.openai?.setWidgetState?.({ modelContent: { jellybeanFurColor: amount } })?.catch(() => {});
    });
    play.addEventListener("click", () => setPlaying(!playing));
    setAmount(window.openai?.widgetState?.modelContent?.jellybeanFurColor);
    window.addEventListener("openai:set_globals", event => {
      setAmount(event.detail?.globals?.widgetState?.modelContent?.jellybeanFurColor);
    });

    Promise.all([loadFrames(0), loadFrames(100)]).then(frames => {
      endpoints = frames;
      drawPose();
      slider.disabled = false;
      play.disabled = false;
      setPlaying(playing);
    }).catch(() => {
      root.querySelector("[role=alert]").hidden = false;
    });
  })();
</script>
